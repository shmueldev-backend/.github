<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-label="SHMUELDEV-BACKEND">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050c16"/>
      <stop offset="28%" stop-color="#07182e"/>
      <stop offset="62%" stop-color="#0a4d86"/>
      <stop offset="100%" stop-color="#1a8fe0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#7ad7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3ec4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#5ac8ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#5ac8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="streams" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="48" height="48" fill="transparent"/>
      <rect x="0" y="0" width="1" height="48" fill="#5ad2ff" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>
  <rect width="1280" height="420" fill="url(#streams)"/>

  <!-- binary bits -->
  <g fill="#aae1ff" fill-opacity="0.28" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2">
    <text x="70" y="58">01</text>
    <text x="180" y="96">10</text>
    <text x="290" y="44">0</text>
    <text x="410" y="120">11</text>
    <text x="540" y="68">01</text>
    <text x="680" y="104">1</text>
    <text x="820" y="52">10</text>
    <text x="960" y="88">0</text>
    <text x="1100" y="64">01</text>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="420" height="3" fill="url(#scan)"/>

  <!-- mark -->
  <g transform="translate(88, 118)">
    <rect width="72" height="72" rx="18" fill="#071525"/>
    <path d="M16 52.5 36 18.5l20 34" stroke="#3ec4ff" stroke-width="4.2" stroke-linejoin="round"/>
    <path d="M21.5 41h29" stroke="#7ad7ff" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="36" cy="41" r="3.2" fill="#ffffff"/>
  </g>

  <text x="188" y="156" fill="#9ad8ff" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">ORGANIZACIÓN · BACKEND</text>
  <text x="188" y="228" fill="#f7fbff" font-family="Segoe UI, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="2">SHMUELDEV-BACKEND</text>
  <text x="188" y="278" fill="#d5e7f6" font-family="Segoe UI, system-ui, sans-serif" font-size="24" letter-spacing="3">APIs · Servicios · Datos · Producción</text>

  <!-- accent chips -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600">
    <rect x="188" y="310" width="108" height="34" rx="17" fill="rgba(122,215,255,0.14)" stroke="#7ad7ff" stroke-opacity="0.45"/>
    <text x="242" y="332" text-anchor="middle" fill="#7ad7ff">FastAPI</text>

    <rect x="310" y="310" width="108" height="34" rx="17" fill="rgba(122,215,255,0.14)" stroke="#7ad7ff" stroke-opacity="0.45"/>
    <text x="364" y="332" text-anchor="middle" fill="#7ad7ff">Django</text>

    <rect x="432" y="310" width="96" height="34" rx="17" fill="rgba(122,215,255,0.14)" stroke="#7ad7ff" stroke-opacity="0.45"/>
    <text x="480" y="332" text-anchor="middle" fill="#7ad7ff">Python</text>

    <rect x="542" y="310" width="78" height="34" rx="17" fill="rgba(122,215,255,0.14)" stroke="#7ad7ff" stroke-opacity="0.45"/>
    <text x="581" y="332" text-anchor="middle" fill="#7ad7ff">SQL</text>

    <rect x="634" y="310" width="108" height="34" rx="17" fill="rgba(122,215,255,0.14)" stroke="#7ad7ff" stroke-opacity="0.45"/>
    <text x="688" y="332" text-anchor="middle" fill="#7ad7ff">APIs</text>
  </g>
</svg>
